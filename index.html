<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World · Behind the Castle Walls</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e1424'/%3E%3Crect x='6' y='5' width='20' height='22' fill='%231b2436' stroke='%23e0a93b'/%3E%3Crect x='6' y='5' width='3' height='22' fill='%23e0a93b'/%3E%3C/svg%3E">
<style>
  :root {
    --night: #0e1424;
    --stone: #1b2436;
    --gold: #e0a93b;
    --parchment: #f4ead6;
    --ink: #1a1206;
    --rail: #7f8ea8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--night);
    color: var(--parchment);
    font: 16px/1.55 Georgia, "Times New Roman", serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  header, .panel {
    position: fixed;
    z-index: 2;
    max-width: min(560px, calc(100vw - 32px));
  }
  header {
    top: max(16px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: max-content;
    max-width: min(560px, calc(100vw - 32px));
  }
  .kicker {
    font: 600 12px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 10px;
  }
  h1 {
    font-size: clamp(26px, 7.5vw, 44px);
    line-height: 1.08;
    margin: 0;
    font-weight: 400;
    letter-spacing: -0.01em;
  }
  h1 em { font-style: italic; color: var(--gold); }
  .sub {
    margin: 10px 0 0;
    font-size: clamp(13px, 3.6vw, 15px);
    color: var(--rail);
  }

  .panel {
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: min(560px, calc(100vw - 32px));
    text-align: center;
  }
  .panel p {
    margin: 0 0 12px;
    font-size: 13px;
    color: var(--rail);
  }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    font: 600 13px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .04em;
    color: var(--ink);
    background: var(--gold);
    border: 0;
    min-height: 44px;
    min-width: 44px;
    padding: 0 18px;
    border-radius: 999px;
    cursor: pointer;
  }
  button.ghost {
    background: transparent;
    color: var(--parchment);
    box-shadow: inset 0 0 0 1px rgba(244, 234, 214, .3);
  }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .stat {
    margin-top: 12px;
    font: 500 12px/1 ui-monospace, Menlo, monospace;
    color: var(--rail);
  }
  @media (prefers-reduced-motion: reduce) {
    .sub { color: #a9b4c6; }
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<header>
  <p class="kicker">Hello World</p>
  <h1>Behind the <em>Castle Walls</em></h1>
  <p class="sub">A bouncing hello, on Railway.</p>
</header>

<div class="panel">
  <p>Tap anywhere to release another page.</p>
  <div class="btns">
    <button id="more" type="button">Release a page</button>
    <button id="reset" class="ghost" type="button">Reset</button>
  </div>
  <div class="stat" id="stat" aria-live="polite"></div>
</div>

<script>
(function () {
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var stat = document.getElementById("stat");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DPR = Math.min(devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var GOLD = "#e0a93b", PARCH = "#f4ead6", STONE = "#1b2436", RAIL = "#7f8ea8";
  var sheets = [];

  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function Sheet(x, y) {
    this.w = 34 + Math.random() * 26;
    this.h = this.w * 1.35;
    this.x = x - this.w / 2;
    this.y = y - this.h / 2;
    var speed = reduce ? 0.6 : 1;
    this.vx = (Math.random() * 5 - 2.5) * speed;
    this.vy = (Math.random() * -5 - 1) * speed;
    this.rot = (Math.random() - 0.5) * 0.6;
    this.spin = (Math.random() - 0.5) * 0.06 * speed;
    this.hue = Math.random() < 0.35 ? RAIL : PARCH;
  }

  Sheet.prototype.step = function () {
    this.vy += 0.32;
    this.x += this.vx;
    this.y += this.vy;
    this.rot += this.spin;
    var floor = H - this.h - 8;
    if (this.y > floor) {
      this.y = floor;
      this.vy *= -0.74;
      this.vx *= 0.99;
      this.spin += (Math.random() - 0.5) * 0.01;
      if (Math.abs(this.vy) < 0.7) { this.vy = 0; this.spin *= 0.9; }
    }
    if (this.y < 0) { this.y = 0; this.vy *= -0.6; }
    if (this.x < 0) { this.x = 0; this.vx *= -0.9; }
    if (this.x + this.w > W) { this.x = W - this.w; this.vx *= -0.9; }
  };

  Sheet.prototype.draw = function () {
    ctx.save();
    ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
    ctx.rotate(this.rot);
    ctx.fillStyle = STONE;
    ctx.strokeStyle = this.hue;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.rect(-this.w / 2, -this.h / 2, this.w, this.h);
    ctx.fill();
    ctx.stroke();
    // ruled lines, like a page
    ctx.strokeStyle = "rgba(127,142,168,.45)";
    ctx.lineWidth = 1;
    var pad = this.w * 0.18;
    for (var i = 1; i <= 3; i++) {
      var yy = -this.h / 2 + (this.h / 4) * i;
      ctx.beginPath();
      ctx.moveTo(-this.w / 2 + pad, yy);
      ctx.lineTo(this.w / 2 - pad, yy);
      ctx.stroke();
    }
    // gold spine
    ctx.fillStyle = GOLD;
    ctx.fillRect(-this.w / 2, -this.h / 2, 4, this.h);
    ctx.restore();
  };

  function add(x, y) {
    if (sheets.length > 60) sheets.shift();
    sheets.push(new Sheet(x, y));
    stat.textContent = sheets.length + (sheets.length === 1 ? " page adrift" : " pages adrift");
  }

  function frame() {
    ctx.fillStyle = "rgba(14,20,36,.28)";
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < sheets.length; i++) { sheets[i].step(); sheets[i].draw(); }
    requestAnimationFrame(frame);
  }

  function seed() {
    var n = Math.min(9, Math.max(4, Math.round(W / 150)));
    for (var i = 0; i < n; i++) add(W * (0.2 + 0.6 * Math.random()), H * (0.25 + 0.3 * Math.random()));
  }

  addEventListener("resize", resize);
  addEventListener("pointerdown", function (e) {
    if (e.target.closest("button")) return;
    add(e.clientX, e.clientY);
  });
  document.getElementById("more").addEventListener("click", function () {
    add(W / 2, H * 0.4);
  });
  document.getElementById("reset").addEventListener("click", function () {
    sheets.length = 0; seed();
  });

  resize();
  ctx.fillStyle = "#0e1424";
  ctx.fillRect(0, 0, W, H);
  seed();
  frame();
})();
</script>
</body>
</html>
